<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Device Frame</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="toolbar">
    <span id="device-name">Loading…</span>
    <button id="reload" title="Reload page">⟳ Reload</button>
  </header>

  <main class="stage">
    <div class="phone" id="phone">
      <span class="btn power"></span>
      <span class="btn volume"></span>
      <div class="screen" id="screen">
        <iframe id="page" allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen"></iframe>
      </div>
      <span class="camera"></span>
    </div>
  </main>

  <script src="viewer.js"></script>
</body>
</html>
