<!doctype html>
<!-- "Entire screen" recording window (see recorder.js). -->
<html>
<head>
<meta charset="utf-8">
<title>Device Frame</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --text: #202124; --muted: #5f6368; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f23; --text: #e6e6e6; --muted: #a8abb2; } }
  body { margin: 0; padding: 16px 20px; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #d93025; visibility: hidden; }
  .dot.on { visibility: visible; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #time { margin-left: auto; font-variant-numeric: tabular-nums; }
  p { margin: 0 0 14px; line-height: 1.4; color: var(--muted); }
  button { font: inherit; height: 30px; padding: 0 14px; border-radius: 4px; border: 1px solid #d93025; background: #d93025; color: #fff; cursor: pointer; }
  button[hidden] { display: none; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span><span id="title"></span><span id="time"></span></h1>
  <p id="status"></p>
  <button id="stop" hidden></button>
  <script src="i18n.js"></script>
  <script src="recorder.js"></script>
</body>
</html>
