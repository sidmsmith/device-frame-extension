<!doctype html>
<!-- One-time microphone permission for screen recordings (see mic.js). -->
<html>
<head>
<meta charset="utf-8">
<title>Device Frame</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --text: #202124; --muted: #5f6368; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1f23; --text: #e6e6e6; --muted: #a8abb2; } }
  body { margin: 0; padding: 20px 24px; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  p { margin: 0 0 16px; line-height: 1.45; color: var(--muted); }
  button { font: inherit; height: 32px; padding: 0 16px; border-radius: 4px; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; cursor: pointer; }
  #status { margin-top: 14px; font-weight: 600; }
  #status.bad { color: #d93025; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="body"></p>
  <button id="allow"></button>
  <div id="status"></div>
  <script src="i18n.js"></script>
  <script src="mic.js"></script>
</body>
</html>
